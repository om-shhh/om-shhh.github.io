---
layout: default
---

<a href="{{ '/writing' | relative_url }}">&larr; Back to Writing</a>

<article style="margin-top: 20px;">
  <h1>{{ page.title }}</h1>
  <p style="color: var(--text-muted); font-size: 0.9em;">Published: {{ page.date | date: "%B %d, %Y" }}</p>
  <hr style="border: none; border-top: 1px solid var(--border-color); margin: 20px 0;">

  {{ content }}
</article>
