<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- Google Fonts: Schibsted Grotesk & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..600;1,300..600&family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #fbf9f5;
      --card-bg: #ffffff;
      --text-color: #242424;
      --text-muted: #6b665e;
      --border-color: #e8e3d9;
      --accent-color: #2b2b2b;
      --hover-bg: #f3efe6;
      --pill-bg: #efeae1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Navigation */
    header {
      margin-bottom: 48px;
    }

    .site-title {
      font-family: 'Schibsted Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .site-title a {
      color: var(--text-color);
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    nav a {
      font-family: 'Schibsted Grotesk', sans-serif;
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      padding: 6px 14px;
      border-radius: 20px;
      background-color: transparent;
      transition: all 0.2s ease;
    }

    nav a:hover {
      background-color: var(--pill-bg);
      color: var(--text-color);
    }

    /* Typography */
    h1, h2, h3, h4 {
      font-family: 'Schibsted Grotesk', sans-serif;
      color: var(--text-color);
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    h1 {
      font-size: 2rem;
      margin-top: 0;
      margin-bottom: 24px;
    }

    p {
      color: var(--text-color);
    }

    img {
      max-width: 100%;
      height: auto;
    }

    /* Grid Layout for Essays & Quotes */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    /* Card Component */
    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #ccc6b8;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    .card h3 {
      font-size: 1.15rem;
      margin: 0 0 10px 0;
      line-height: 1.3;
    }

    .card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0 0 16px 0;
      flex-grow: 1;
    }

    /* Meta Pill Tags */
    .meta-pill {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      background-color: var(--pill-bg);
      padding: 4px 10px;
      border-radius: 12px;
      width: fit-content;
    }

    /* Quote Card Styling */
    .quote-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      position: relative;
    }

    .quote-card p {
      font-size: 0.95rem;
      font-style: italic;
      color: var(--text-color);
      margin: 0 0 16px 0;
      line-height: 1.5;
    }

    .quote-author {
      font-family: 'Schibsted Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    footer {
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="site-title"><a href="{{ '/' | relative_url }}">Om Shah</a></div>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/writing' | relative_url }}">Writing</a>
      <a href="{{ '/quotes' | relative_url }}">Quotes</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>Om Shah &copy; {{ 'now' | date: "%Y" }}</p>
  </footer>

</body>
</html>
